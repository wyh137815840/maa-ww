# MaaWW → MaaFwApp 打包配方（对齐 MaaEnd Android/profile.yaml）
# 相对路径相对本文件。
#
# 目标游戏（官服，对齐 _ref_maaww launchGame / am start）：
#   package  com.kurogame.mingchao
#   activity com.epicgames.ue4.GameActivity
# Pipeline：assets/resource_adb/pipeline/Startup.json → StartApp / StopApp

assets: ../assets

include:
  - interface.json
  - tasks/**
  - resource/**
  - resource_adb/**
  - locales/**

# Go agent：CombatLoop（无音区本内战斗）等 CustomAction
agent:
  sourceDir: agent-dist
  runtimes:
    - location: nativeLibs
      executable: libgo-service.so
      name: go-service
      env:
        # MaaFramework 依赖同目录 libfastdeploy_ppocr 等，需要 LD_LIBRARY_PATH。
        # 包内须排除 AndroidX libtracing_perfetto.so（见 app packaging.jniLibs.excludes），
        # 否则会遮蔽系统符号导致 dlopen 失败。
        LD_LIBRARY_PATH: "{nativeLibs}"
        MAAFW_BINARY_PATH: "{nativeLibs}"

display:
  foreground: false
  presets:
    - label: 720P
      width: 1280
      height: 720
      dpi: 240

app:
  id: maaww
  label: MaaWW

logs:
  include:
    - debug/**/*.log
